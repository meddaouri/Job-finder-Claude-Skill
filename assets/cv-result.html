<!-- iJob CV-ready card, shown right after the CV file is delivered. Fill D (and labels) in the user's language. -->
<style>
:root{--ij-blue:#0B5FD6;--ij-dark:#1F242B;--ij-bg:#fff;--ij-soft:#F2F5F9;--ij-line:#DCE2EA;--ij-muted:#5A6370;--ij-ok:#1E7B3A;--ij-warn:#8A5A00}
@media (prefers-color-scheme:dark){:root{--ij-dark:#ECEFF3;--ij-bg:#1B1F25;--ij-soft:#242A31;--ij-line:#333A43;--ij-muted:#A3ACB8;--ij-ok:#8FD7A6;--ij-warn:#F3C76B}}
.cr{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ij-dark);font-size:14px;max-width:720px;margin:0 auto;padding:12px 0}
.cr .hero{display:flex;gap:14px;align-items:center;background:var(--ij-bg);border:2px solid var(--ij-blue);border-radius:16px;padding:16px}
.cr .av{width:56px;height:56px;border-radius:50%;background:var(--ij-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.cr .nm{font-size:18px;font-weight:700;margin:0}.cr .rl{color:var(--ij-blue);margin:2px 0 0;font-weight:600}
.cr .ok{margin-inline-start:auto;font-size:12px;background:#E6F4EA;color:#1E7B3A;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.cr .box{background:var(--ij-bg);border:1px solid var(--ij-line);border-radius:14px;padding:14px 16px;margin-top:10px}
.cr .meter{display:flex;align-items:center;gap:12px}
.cr .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ij-blue) calc(var(--p)*1%),var(--ij-soft) 0);display:flex;align-items:center;justify-content:center;flex:none;transition:--p 1s}
.cr .ring span{width:50px;height:50px;border-radius:50%;background:var(--ij-bg);display:flex;align-items:center;justify-content:center;font-weight:700}
.cr ul{list-style:none;margin:0;padding:0;flex:1}.cr li{font-size:13px;margin:3px 0}
.cr li.no{color:var(--ij-warn)}
.cr .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.cr .act{font:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:12px;border:1px solid var(--ij-line);background:var(--ij-bg);color:var(--ij-dark);cursor:pointer;text-align:start;transition:transform .15s,border-color .15s}
.cr .act:hover{transform:translateY(-2px);border-color:var(--ij-blue)}
.cr .act.main{grid-column:1/-1;border:0;color:#fff;text-align:center;font-size:16px;position:relative;overflow:hidden;animation:crHue 4s ease-in-out infinite}
.cr .act.main::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:crShine 2.6s infinite}
.cr .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.cr .lk{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;text-decoration:none;color:#fff;font-size:13px;line-height:1.5;background:var(--c1);animation:crLk 4s ease-in-out infinite}
.cr .lk::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:crShine 2.6s infinite}
.cr .lk b{display:block;font-size:14px}.cr .lk .ic{font-size:22px}
.cr .lk:nth-child(1){--c1:#0B5FD6;--c2:#0A8F6A}.cr .lk:nth-child(2){--c1:#E8590C;--c2:#C2255C}.cr .lk:nth-child(3){--c1:#7048E8;--c2:#0B5FD6}
@keyframes crHue{0%,100%{background:#0B5FD6}50%{background:#0A8F6A}}
@keyframes crLk{0%,100%{background:var(--c1)}50%{background:var(--c2)}}
@keyframes crShine{0%{left:-50%}60%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.cr .act.main,.cr .act.main::after,.cr .lk,.cr .lk::after{animation:none}}
</style>
<div class="cr" id="cr"></div>
<script>
const D={dir:"rtl",name:"",role:"",ready:"✓ الـ CV واجد",
 strengthLabel:"قوة الـ CV",score:0, // 0-100, honest estimate
 checks:[{ok:true,t:""}], // what's good / what's missing (ok:false = tip)
 actions:[ // main first. p = message sent to Claude
  {main:true,t:"🚀 قلب ليا على خدمة بهاد الـ CV",p:"[ijob-search] قلب ليا على عروض مناسبة لهاد الـ CV"},
  {t:"🇬🇧 نسخة بالإنجليزية",p:"صاوب ليا نسخة إنجليزية من الـ CV"},
  {t:"✉️ Lettre de motivation",p:"كتب ليا lettre de motivation عامة بهاد الـ CV"},
  {t:"✏️ بدل شي حاجة",p:"بغيت نبدل شي حاجة فالـ CV"}],
 links:[{icon:"💼",title:"",text:"",url:"https://ijob.ma/category/emploi/"}]};
(function(){const R=document.getElementById("cr");R.dir=D.dir;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=D.name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
R.innerHTML=`<div class="hero"><div class="av">${esc(ini)}</div><div><p class="nm">${esc(D.name)}</p><p class="rl">${esc(D.role)}</p></div><span class="ok">${esc(D.ready)}</span></div>
<div class="box meter"><div class="ring" id="rg"><span id="rn">0%</span></div><ul><li style="font-weight:600;margin-bottom:6px">${esc(D.strengthLabel)}</li>${D.checks.map(c=>`<li class="${c.ok?"":"no"}">${c.ok?"✅":"💡"} ${esc(c.t)}</li>`).join("")}</ul></div>
<div class="acts">${D.actions.map((a,i)=>`<button class="act${a.main?" main":""}" data-i="${i}">${esc(a.t)}</button>`).join("")}</div>
<div class="links">${D.links.map(l=>`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic">${esc(l.icon)}</span><span><b>${esc(l.title)}</b>${esc(l.text)}</span></a>`).join("")}</div>`;
R.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const p=D.actions[+b.dataset.i].p;try{if(typeof sendPrompt==="function"){sendPrompt(p);return}}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(p)});
let v=0;const rg=document.getElementById("rg"),rn=document.getElementById("rn");const tm=setInterval(()=>{v=Math.min(D.score,v+3);rg.style.setProperty("--p",v);rn.textContent=v+"%";if(v>=D.score)clearInterval(tm)},25)})();
</script>
