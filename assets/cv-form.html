<!-- iJob CV builder form. Fill PREFILL (from an old CV, or leave empty) and L (labels in the user's language). Render inline or as an artifact. The "Generate" button sends everything back to Claude with sendPrompt. -->
<style>
:root{--ij-blue:#0B5FD6;--ij-dark:#1F242B;--ij-bg:#fff;--ij-soft:#F2F5F9;--ij-line:#DCE2EA;--ij-muted:#5A6370;--ij-err:#C92A2A;--ij-ok:#1E7B3A}
@media (prefers-color-scheme:dark){:root{--ij-dark:#ECEFF3;--ij-bg:#1B1F25;--ij-soft:#242A31;--ij-line:#333A43;--ij-muted:#A3ACB8;--ij-err:#FF8787;--ij-ok:#8FD7A6}}
.cf{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ij-dark);font-size:14px;max-width:720px;margin:0 auto;padding:12px 0}
.cf .pg{position:sticky;top:0;background:var(--ij-bg);padding:8px 0 10px;z-index:2}
.cf .pgt{display:flex;justify-content:space-between;font-size:12px;color:var(--ij-muted);margin-bottom:6px}
.cf .pgb{height:8px;border-radius:4px;background:var(--ij-soft);overflow:hidden}.cf .pgb span{display:block;height:100%;width:0;background:var(--ij-blue);transition:width .3s}
.cf .st{background:var(--ij-bg);border:1px solid var(--ij-line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cf .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cf .sn{width:28px;height:28px;border-radius:50%;background:var(--ij-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.cf .sn.ok{background:var(--ij-ok)}
.cf .stt{font-weight:600;font-size:15px}
.cf .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cf input,.cf textarea,.cf select{font:inherit;width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--ij-line);border-radius:10px;background:var(--ij-bg);color:var(--ij-dark)}
.cf textarea{min-height:64px;resize:vertical}
.cf input:focus,.cf textarea:focus{outline:2px solid var(--ij-blue);outline-offset:0;border-color:transparent}
.cf .chips{display:flex;gap:6px;flex-wrap:wrap}
.cf .chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--ij-line);background:transparent;color:var(--ij-dark);cursor:pointer;transition:all .15s}
.cf .chip.on{background:var(--ij-blue);border-color:var(--ij-blue);color:#fff}
.cf .row{border:1px dashed var(--ij-line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
.cf .rm{position:absolute;top:6px;inset-inline-end:8px;border:0;background:transparent;color:var(--ij-muted);cursor:pointer;font-size:16px}
.cf .add{font:inherit;font-size:13px;border:1px dashed var(--ij-blue);color:var(--ij-blue);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;width:100%}
.cf .lang{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}.cf .lang b{min-width:90px;font-weight:500}
.cf .hint{font-size:12px;color:var(--ij-muted);margin:6px 0 0}
.cf .err{font-size:13px;color:var(--ij-err);margin:6px 0 0;min-height:0}
.cf .go{font:inherit;font-size:16px;font-weight:700;width:100%;padding:14px;border:0;border-radius:14px;color:#fff;background:var(--ij-blue);cursor:pointer;position:relative;overflow:hidden;animation:cfHue 4s ease-in-out infinite}
.cf .go::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:cfShine 2.6s infinite}
@keyframes cfHue{0%,100%{background:#0B5FD6}50%{background:#0A8F6A}}
@keyframes cfShine{0%{left:-50%}60%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.cf .go,.cf .go::after{animation:none}}
</style>
<div class="cf" id="cf"></div>
<script>
const L={dir:"rtl",progress:"تقدم الـ CV",s1:"المعلومات ديالك",s2:"الخدمة اللي باغي",s3:"الشهادات",s4:"الخبرة والسطاجات",s5:"المهارات",s6:"اللغات",s7:"إضافات (اختياري)",
 name:"الاسم الكامل",city:"المدينة",phone:"التيليفون",email:"الإيميل",linkedin:"LinkedIn (اختياري)",role:"مثلاً: Comptable, Technicien électricien…",
 dipName:"الشهادة (مثلاً: Technicien Spécialisé en Comptabilité)",dipSchool:"المؤسسة والمدينة",dipYear:"العام",addDip:"+ زيد شهادة",
 expRole:"المنصب",expCo:"الشركة والمدينة",expFrom:"من (مثلاً 09/2025)",expTo:"حتى (أو: دابا)",expTasks:"شنو كنتي كدير؟ (بالدارجة عادي)",addExp:"+ زيد خبرة أو سطاج",noExp:"ما عنديش خبرة مازال",
 skills:"البرامج والمهارات (Excel, Sage, AutoCAD…)",permis:"عندي البيرمي",extra:"شهادات أخرى، بنفولا، أنشطة…",
 cvLang:"لغة الـ CV",go:"صاوب ليا الـ CV ديالي ✨",errName:"كتب الاسم ديالك",errRole:"كتب الخدمة اللي باغي",errPhone:"زيد التيليفون ولا الإيميل",
 levels:["لغة الأم","مزيان بزاف","مزيان","متوسط","شوية"],langs:["العربية","الفرنسية","الإنجليزية","الإسبانية","الأمازيغية"],cvLangs:["Français","English","العربية"],
 rolesQuick:["Comptable","Commercial","Conseiller client","Technicien","Assistant(e) administratif","Développeur","Infirmier(e)","Chauffeur"]};
const PREFILL={}; // e.g. {name:"",city:"",phone:"",email:"",role:"",dips:[{name:"",school:"",year:""}],exps:[{role:"",co:"",from:"",to:"",tasks:""}],skills:"",permis:false,langs:{"العربية":"لغة الأم"},extra:"",cvLang:"Français"}
(function(){
const S=Object.assign({name:"",city:"",phone:"",email:"",linkedin:"",role:"",dips:[{}],exps:[{}],noExp:false,skills:"",permis:false,langs:{},extra:"",cvLang:"Français"},PREFILL);
const R=document.getElementById("cf");R.dir=L.dir;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inp=(k,ph,v,t)=>`<input data-k="${k}" placeholder="${esc(ph)}" value="${esc(v)}" ${t?`type="${t}"`:""}>`;
const st=(n,t,body,ok)=>`<div class="st"><div class="sh"><div class="sn${ok?" ok":""}">${ok?"✓":n}</div><div class="stt">${t}</div></div>${body}</div>`;
function done(){return{1:!!(S.name&&(S.phone||S.email)),2:!!S.role,3:S.dips.some(d=>d.name),4:S.noExp||S.exps.some(e=>e.role),5:!!S.skills,6:Object.keys(S.langs).length>0}}
function draw(){const d=done();
R.innerHTML=`<div class="pg"><div class="pgt"><span>${L.progress}</span><span id="pc"></span></div><div class="pgb"><span id="pb"></span></div></div>`+
st(1,L.s1,`<div class="g">${inp("name",L.name,S.name)}${inp("city",L.city,S.city)}${inp("phone",L.phone,S.phone,"tel")}${inp("email",L.email,S.email,"email")}${inp("linkedin",L.linkedin,S.linkedin)}</div>`,d[1])+
st(2,L.s2,`${inp("role",L.role,S.role)}<div class="chips" style="margin-top:8px">${L.rolesQuick.map(r=>`<button class="chip${S.role===r?" on":""}" data-role="${esc(r)}">${esc(r)}</button>`).join("")}</div>`,d[2])+
st(3,L.s3,S.dips.map((x,i)=>`<div class="row">${i?`<button class="rm" data-rm="dips:${i}" aria-label="x">✕</button>`:""}<div class="g"><input data-a="dips:${i}:name" placeholder="${esc(L.dipName)}" value="${esc(x.name)}"><input data-a="dips:${i}:school" placeholder="${esc(L.dipSchool)}" value="${esc(x.school)}"><input data-a="dips:${i}:year" placeholder="${esc(L.dipYear)}" value="${esc(x.year)}"></div></div>`).join("")+`<button class="add" data-add="dips">${L.addDip}</button>`,d[3])+
st(4,L.s4,`<div class="chips" style="margin-bottom:8px"><button class="chip${S.noExp?" on":""}" data-noexp>${L.noExp}</button></div>`+(S.noExp?"":S.exps.map((x,i)=>`<div class="row">${i?`<button class="rm" data-rm="exps:${i}" aria-label="x">✕</button>`:""}<div class="g"><input data-a="exps:${i}:role" placeholder="${esc(L.expRole)}" value="${esc(x.role)}"><input data-a="exps:${i}:co" placeholder="${esc(L.expCo)}" value="${esc(x.co)}"><input data-a="exps:${i}:from" placeholder="${esc(L.expFrom)}" value="${esc(x.from)}"><input data-a="exps:${i}:to" placeholder="${esc(L.expTo)}" value="${esc(x.to)}"></div><textarea data-a="exps:${i}:tasks" placeholder="${esc(L.expTasks)}" style="margin-top:8px">${esc(x.tasks)}</textarea></div>`).join("")+`<button class="add" data-add="exps">${L.addExp}</button>`),d[4])+
st(5,L.s5,`<textarea data-k="skills" placeholder="${esc(L.skills)}">${esc(S.skills)}</textarea><div class="chips" style="margin-top:8px"><button class="chip${S.permis?" on":""}" data-permis>🚗 ${L.permis}</button></div>`,d[5])+
st(6,L.s6,L.langs.map(g=>`<div class="lang"><b>${g}</b><div class="chips">${L.levels.map(v=>`<button class="chip${S.langs[g]===v?" on":""}" data-lg="${esc(g)}" data-lv="${esc(v)}">${v}</button>`).join("")}</div></div>`).join(""),d[6])+
st(7,L.s7,`<textarea data-k="extra" placeholder="${esc(L.extra)}">${esc(S.extra)}</textarea><p class="hint">${L.cvLang}</p><div class="chips">${L.cvLangs.map(c=>`<button class="chip${S.cvLang===c?" on":""}" data-cl="${esc(c)}">${c}</button>`).join("")}</div>`,false)+
`<button class="go" id="go">${L.go}</button><p class="err" id="er"></p>`;
bind();prog()}
function prog(){const d=done(),n=Object.values(d).filter(Boolean).length,p=Math.round(n/6*100);const pb=document.getElementById("pb"),pc=document.getElementById("pc");if(pb)pb.style.width=p+"%";if(pc)pc.textContent=p+"%"}
function bind(){
R.querySelectorAll("[data-k]").forEach(e=>e.oninput=()=>{S[e.dataset.k]=e.value;prog();document.getElementById("er").textContent=""});
R.querySelectorAll("[data-a]").forEach(e=>e.oninput=()=>{const[a,i,f]=e.dataset.a.split(":");S[a][+i][f]=e.value;prog()});
R.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{S.role=b.dataset.role;draw()});
R.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{S[b.dataset.add].push({});draw()});
R.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[a,i]=b.dataset.rm.split(":");S[a].splice(+i,1);draw()});
R.querySelectorAll("[data-noexp]").forEach(b=>b.onclick=()=>{S.noExp=!S.noExp;draw()});
R.querySelectorAll("[data-permis]").forEach(b=>b.onclick=()=>{S.permis=!S.permis;draw()});
R.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{const g=b.dataset.lg;S.langs[g]=S.langs[g]===b.dataset.lv?undefined:b.dataset.lv;if(!S.langs[g])delete S.langs[g];draw()});
R.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{S.cvLang=b.dataset.cl;draw()});
document.getElementById("go").onclick=submit}
function submit(){const er=document.getElementById("er");
if(!S.name.trim()){er.textContent=L.errName;return}if(!S.role.trim()){er.textContent=L.errRole;return}if(!S.phone.trim()&&!S.email.trim()){er.textContent=L.errPhone;return}
const lines=["[ijob-cv] صاوب ليا CV احترافي بهاد المعلومات:",
`Nom: ${S.name} | Ville: ${S.city} | Tél: ${S.phone} | Email: ${S.email}${S.linkedin?" | LinkedIn: "+S.linkedin:""}`,
`Poste visé: ${S.role}`,
"Formation:",...S.dips.filter(d=>d.name).map(d=>`- ${d.name} — ${d.school||""} — ${d.year||""}`),
"Expérience:",...(S.noExp?["- Pas encore d'expérience"]:S.exps.filter(e=>e.role).map(e=>`- ${e.role} — ${e.co||""} — ${e.from||""} → ${e.to||""}: ${e.tasks||""}`)),
`Compétences: ${S.skills}${S.permis?" | Permis B":""}`,
`Langues: ${Object.entries(S.langs).map(([g,v])=>g+" ("+v+")").join(", ")}`,
S.extra?`Extra: ${S.extra}`:"",`Langue du CV: ${S.cvLang}`].filter(Boolean).join("\n");
try{if(typeof sendPrompt==="function"){sendPrompt(lines);return}}catch(e){}
navigator.clipboard&&navigator.clipboard.writeText(lines);er.style.color="var(--ij-ok)";er.textContent="✓ Copied — paste it in the chat"}
draw()})();
</script>
